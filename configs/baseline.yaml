# @package _global_

# Configuration for sklearn baseline runner
defaults:
  - _self_
  - dataset: motrpac
  - logger: wandb
  - paths: default
  - hydra: default
  - hf: default

# task name
task_name: "baseline"

# tags to help identify experiments
tags: ["baseline", "sklearn"]

# seed for random number generators
seed: 42

# Filter which baselines to run: "standard", "gnn_features", or null (all)
baseline_filter: null

# For k-fold runs, evaluate every candidate on all folds and select one
# hyperparameter configuration by mean validation score. Every fold is then
# refit and evaluated with that same configuration, matching the GNN Optuna
# trial protocol. Set to "per_fold" only to reproduce the historical behavior.
baseline_hparam_selection: global_kfold_mean_validation
baseline_hparam_cache_dir: ${paths.log_dir}/baseline/hparam_selection
