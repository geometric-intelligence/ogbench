_target_: src.models.gcn_module.GCNLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 15

net:
  _target_: torch_geometric.nn.GCN
  num_layers: 4
  in_channels: 1
  hidden_channels: 2048
  out_channels: 1

# compile model for faster training with pytorch 2.0
compile: false
