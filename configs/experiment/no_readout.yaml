# @package _global_

# NoReadOut experiment configuration

defaults:
  - override /dataset: parkinsons # Default, override via CLI
  - override /model: gcn # Default, override via CLI
  - override /callbacks: default
  - override /trainer: default

tags:
  [
    "no_readout",
    "${model.model_name}",
    "${dataset.loader.parameters.data_name}",
    "${dataset.loader.parameters.method}",
  ]

seed: 42

logger:
  wandb:
    tags: ${tags}

trainer:
  min_epochs: 50
  max_epochs: 200
  gradient_clip_val: 0.5

model:
  backbone_wrapper:
    residual_connections: false
  readout:
    readout_name: NoReadOut
    # num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}
    # hidden_dim: ${model.feature_encoder.out_channels}
    # out_channels: ${dataset.parameters.num_classes}
    # task_level: ${dataset.parameters.task_level}
    # pooling_type: mean
