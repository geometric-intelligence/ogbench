# @package _global_

# to execute this experiment run:
# python train.py experiment=rtgnn

defaults:
  - override /data: addneuromed
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

tags: ["addneuromed", "rtgnn"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 0.002
  net:
    _target_: src.models.gnn_models.RTGNN
    in_channels: 1
    hidden_channels: 2048
    out_channels: 4
    alpha: 0.05  # Temporal importance
    beta: 0.03   # Spatial importance
    gamma: 0.01  # Feature importance
  compile: false

data:
  batch_size: 64

logger:
  wandb:
    tags: ${tags}
    group: "addneuromed"
  aim:
    experiment: "addneuromed" 