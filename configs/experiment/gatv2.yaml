# @package _global_

# to execute this experiment run:
# python train.py experiment=gatv2

defaults:
  - override /data: addneuromed
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

seed: 12345

trainer:
  gradient_clip_val: 0

model:
  net:
    _target_: torch_geometric.nn.models.GAT
    num_layers: 4
    in_channels: 1
    hidden_channels: 1024
    out_channels: 1
    dropout: 0.2
    v2: true
data:
  batch_size: 128

logger:
  wandb:
    tags: ${tags}