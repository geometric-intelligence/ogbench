# @package _global_

# to execute this experiment run:
# python train.py experiment=gatv2

defaults:
  - override /data: addneuromed
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

tags: ["addneuromed", "gatv2"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 0.5

model:
  net:
    _target_: torch_geometric.nn.models.GAT
    num_layers: 4
    in_channels: 1
    hidden_channels: 256
    out_channels: 1
    v2: true

    #graph_pooling: mean

data:
  batch_size: 4

logger:
  wandb:
    tags: ${tags}