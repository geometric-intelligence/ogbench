# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: pancancer
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: gpu

seed: 12345
device_id: "2"
trainer:
  min_epochs: 1000
  max_epochs: 1000
  gradient_clip_val: 0

model:
  optimizer:
    lr: 0.001
  net:
    in_channels: 1
    hidden_channels: 512
    out_channels: 1
    num_layers: 2

  compile: false
  adjacency_aware: true
data:
  batch_size: 64
  method: correlation

logger:
  wandb:
    tags: ${tags}