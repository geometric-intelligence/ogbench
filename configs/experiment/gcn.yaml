# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: pancancer
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 100
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 0.01
  net:
    in_channels: 1
    hidden_channels: 256
    out_channels: 1
    #graph_pooling: mean
  compile: false

data:
  batch_size: 64

logger:
  wandb:
    tags: ${tags}