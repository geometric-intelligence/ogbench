# @package _global_

# to execute this experiment run:
# python train.py experiment=graphsage

defaults:
  - override /data: pancancer
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 50
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 1e-3
    weight_decay: 0.0 #1e-4
  net:
    _target_: torch_geometric.nn.MLP
    in_channels: 1
    out_channels: 1
    num_layers: 5
    channel_list: [16384, 8192, 4096, 2048, 1024]
    hidden_channels: 8192
    dropout: 0.2
  compile: false

data:
  batch_size: 16

logger:
  wandb:
    tags: ${tags}