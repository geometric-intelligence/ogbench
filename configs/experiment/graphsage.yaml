# @package _global_

# to execute this experiment run:
# python train.py experiment=graphsage

defaults:
  - override /data: addneuromed
  - override /model: graphsage
  - override /callbacks: default
  - override /trainer: default

tags: ["addneuromed", "graphsage"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 0.002
  net:
    in_channels: 1
    hidden_channels: 2048
    out_channels: 4
  compile: false

data:
  batch_size: 64

logger:
  wandb:
    tags: ${tags}
    group: "addneuromed"
  aim:
    experiment: "addneuromed" 