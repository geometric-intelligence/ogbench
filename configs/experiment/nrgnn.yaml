# @package _global_

# to execute this experiment run:
# python train.py experiment=nrgnn

defaults:
  - override /data: addneuromed
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

tags: ["addneuromed", "nrgnn"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 0.5

model:
  optimizer:
    lr: 0.002
  net:
    _target_: src.models.gnn_models.NRGNN
    in_channels: 1
    hidden_channels: 2048
    out_channels: 4
    alpha: 0.01  # Node feature importance
    beta: 0.01   # Edge importance
    gamma: 0.0   # Structure importance
  compile: false

data:
  batch_size: 64

logger:
  wandb:
    tags: ${tags}