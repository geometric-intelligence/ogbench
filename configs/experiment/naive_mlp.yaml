# @package _global_

# to execute this experiment run:
# python train.py experiment=graphsage

defaults:
  - override /data: pancancer
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

seed: 12345
  

trainer:
  min_epochs: 1
  max_epochs: 1000
  gradient_clip_val: 0.0

model:
  optimizer:
    _target_: torch.optim.Adam
    lr: 1e-3
    # weight_decay: 0.0
    weight_decay: 0.001
  net:
    _target_: src.models.naive_models.MLP4
    in_channels: 1
    out_channels: 64
    hidden_channels: 1024
    num_layers: 3
  compile: false
  adjacency_aware: false

data:
  batch_size: 654
  node_sample_ratio: 2

logger:
  wandb:
    tags: ${tags}