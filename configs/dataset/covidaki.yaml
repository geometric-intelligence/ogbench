loader:
  _target_: ogbench.data.loaders.graph.OmicsDatasetLoader
  parameters:
    data_type: omics
    data_domain: graph
    data_name: covidaki
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_type}
    adjacency_threshold: 0.95
    node_sample_ratio: 0.169
    method: variance
    imputation_method: mean
    train_val_test_split: [0.7, 0.15, 0.15]
    revision: e1631e8

parameters:
  num_features: 1
  num_classes: 2
  num_samples: 1135
  full_num_nodes: 4702
  num_nodes: ${calculate_num_nodes:${dataset.parameters.num_samples},${dataset.loader.parameters.train_val_test_split},${dataset.loader.parameters.node_sample_ratio}, ${dataset.parameters.full_num_nodes}} # 4698 # TODO: it depends on the node sample ratio!
  task: classification
  # Class 0: 103 samples (9%) Class 1: 1032 samples (91%) weight class: N_samples / (num_classes * n_samples_for_class)
  class_weights: [5.5, 0.55]
  loss_type: cross_entropy
  monitor_metric: f1_weighted
  task_level: graph
  metrics:
    ["accuracy", "precision", "recall", "auroc", "f1_weighted", "f1_macro"]

split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/${dataset.loader.parameters.data_name}/data_splits
  data_seed: 0
  split_type: "fixed"

dataloader_params:
  batch_size: 8
  num_workers: 0
  pin_memory: False
  persistent_workers: False

baselines:
  svm:
    pipeline:
      - name: feature_selection
        _target_: sklearn.feature_selection.SelectKBest
        score_func:
          _target_: sklearn.feature_selection.f_classif
        k: 100
      - name: scaler
        _target_: sklearn.preprocessing.StandardScaler
      - name: calibrated_svm
        _target_: sklearn.calibration.CalibratedClassifierCV
        estimator:
          _target_: sklearn.svm.LinearSVC
          class_weight: balanced
          max_iter: 5000
          random_state: ${seed}
        method: sigmoid
    param_grid:
      feature_selection__k: [50, 100, 500]
      calibrated_svm__estimator__C: [1e-3, 1e-2, 1e-1]
    scoring: f1_weighted
    n_jobs: -1
  elastic_net:
    pipeline:
      - name: feature_selection
        _target_: sklearn.feature_selection.SelectKBest
        score_func:
          _target_: sklearn.feature_selection.f_classif
        k: 100
      - name: scaler
        _target_: sklearn.preprocessing.StandardScaler
      - name: elastic_net
        _target_: sklearn.linear_model.LogisticRegression
        penalty: elasticnet
        solver: saga
        class_weight: balanced
        max_iter: 5000
        random_state: ${seed}
    param_grid:
      feature_selection__k: [50, 100, 500]
      elastic_net__C: [1e-3, 1e-2, 1e-1, 1.0]
      elastic_net__l1_ratio: [0.0, 0.1, 0.3, 0.5, 0.7]
    scoring: "f1_macro"
    n_jobs: -1
