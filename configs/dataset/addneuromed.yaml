loader:
  _target_: ogbench.data.loaders.graph.omics_datasets.OmicsDatasetLoader
  parameters:
    data_type: omics
    data_domain: graph
    data_name: addneuromed
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_type}
    adjacency_threshold: 0.85
    node_sample_ratio: 1.0
    method: variance
    imputation_method: mean
    train_val_test_split: [0.7, 0.15, 0.15]

parameters:
  num_features: 1
  num_classes: 7 # ('AD', 'CTL', 'CTL to AD', 'MCI', 'MCI to CTL', 'OTHER', 'borderline MCI')
  num_samples: 717
  num_nodes: 8016 #${calculate_num_nodes:${dataset.parameters.num_samples},${dataset.loader.parameters.train_val_test_split},${dataset.loader.parameters.node_sample_ratio}} # 4698 # TODO: it depends on the node sample ratio!
  task: classification
  loss_type: cross_entropy
  monitor_metric: f1_weighted
  task_level: graph
  metrics: ["accuracy", "precision", "recall", "auroc", "f1_weighted"]

split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/${dataset.loader.parameters.data_name}/data_splits
  data_seed: 0
  split_type: "fixed"

dataloader_params:
  batch_size: 16
  num_workers: 0
  pin_memory: False
  persistent_workers: False
