# Dataset loader config
loader:
  _target_: topobench.data.loaders.OmicsDatasetLoader
  parameters:
    data_type: omics
    data_domain: graph
    data_name: covidaki
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_type}
    adjacency_threshold: 0.9
    node_sample_ratio: 0.169
    method: variance
    imputation_method: mean
    train_val_test_split: [0.7, 0.15, 0.15]

# Dataset parameters
parameters:
  num_features: 1
  num_classes: 2
  num_samples: 1135
  num_nodes: 4698
  task: classification
  loss_type: cross_entropy
  monitor_metric: accuracy
  task_level: graph

#splits
split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/${dataset.loader.parameters.data_name}/data_splits
  data_seed: 0
  split_type: 'fixed' # ZINC accept only <fixed> split

# Dataloader parameters
dataloader_params:
  batch_size: 16
  num_workers: 0
  pin_memory: False
  persistent_workers: False
