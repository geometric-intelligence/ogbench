# Resumable Optuna sweep with separate studies for every ablation cell.
#
# Examples:
#   python scripts/optuna_search.py --config configs/hparams_search/multi_dataset_optuna_search.yaml --gpus 0 2 --jobs-per-gpu 2 --warmup-jobs 4
#   python scripts/optuna_search.py --config configs/hparams_search/multi_dataset_optuna_search.yaml --models gcn gin --gpus 0
#   python scripts/optuna_search.py --config configs/hparams_search/multi_dataset_optuna_search.yaml --retry-failed --gpus 0 1
#   python scripts/optuna_search.py --config configs/hparams_search/multi_dataset_optuna_search.yaml --dry-run --models gcn --datasets motrpac
#
# GPU IDs are logical IDs visible to this launcher. For example, after
# CUDA_VISIBLE_DEVICES=3,5, use --gpus 0 1.

datasets:
  - parkinsons
  - addneuromed
  - motrpac
  - brca
  - tuberculosis
  - smoking

models:
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - sagn
  - chebnet
  - mlp
  - gps

# Each trial uses one fixed model-initialization RNG seed and all five CV folds.
training_seed: 42
k: 5
folds: [0, 1, 2, 3, 4]

fixed:
  logger.wandb.project: ogbench_dataset_optuna

# Every combination below becomes a separate Optuna study. These values are
# never sampled by Optuna or compared as candidate hyperparameters.
ablations:
  experiment:
    - omics_readout
    - no_readout
  dataset.loader.parameters.adjacency_method:
    - wgcna
    - string
  dataset.loader.parameters.node_sample_ratio:
    - 1.0
    - 0.8
    - 0.5
  dataset.loader.parameters.method:
    - variance
    - random
    - correlation
    - distance_correlation

# MLP directly produces flattened graph logits and has no graph
# backbone_wrapper output for OmicsReadOut to consume.
exclude_cells:
  - model: mlp
    experiment: omics_readout

# Shared parameters sampled inside each study.
search_space:
  optimizer.parameters.lr:
    type: float
    low: 0.00001
    high: 0.01
    log: true
  optimizer.parameters.weight_decay:
    type: categorical
    choices: [0.0, 0.000001, 0.00001, 0.0001]
  model.backbone.dropout:
    type: float
    low: 0.0
    high: 0.5
    step: 0.1

# Only the selected model's conditional space is added to a trial.
per_model_search_space:
  gcn:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  gin:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  gatv2:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.backbone.heads: [2, 4, 8]

  gatv4:
    model.backbone.hidden_channels:
      type: categorical
      choices:
        - [16, 32]
        - [32, 64]
        - [64, 128]
    model.backbone.heads:
      type: categorical
      choices:
        - [4, 4]
        - [8, 8]
    model.backbone.use_layer_norm: [true, false]

  graph_sage:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  sagn:
    model.backbone.hidden_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.backbone.num_heads: [2, 4, 8]

  chebnet:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  mlp:
    model.backbone.hidden_channels:
      type: categorical
      choices:
        - [16, 32, 8]
        - [32, 64, 16]
        - [64, 128, 32]
    model.backbone.norm: [null, batch]

  gps:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.encodings:
      type: categorical
      choices:
        - [LapPE]
        - [RWSE]

# WGCNA graphs keep the strongest undirected edges nearest to 10% connectivity
# on each fold's training samples. STRING still uses a fixed score cutoff.
wgcna_target_connectivity: 0.10
string_adjacency_threshold: 0.4

objective:
  metric: best_val/f1_macro
  direction: maximize

optuna:
  n_trials: 20
  sampler_seed: 1234
  n_startup_trials: 10
  study_name_prefix: ogbench
  heartbeat_interval: 60
  grace_period: 300
  max_retries: 1

tags:
  - optuna_ablation

training:
  timeout: 3600
  output_dir: ./search_results/multi_dataset_optuna
