# Small but statistically complete five-fold Optuna integration test.
# Run without training:
#   python scripts/optuna_search.py --config configs/hparams_search/optuna_smoke_test.yaml --dry-run

datasets: [motrpac]
models: [gcn]
training_seed: 42
k: 5
folds: [0, 1, 2, 3, 4]

fixed:
  logger.wandb.project: ogbench_optuna_smoke_test

ablations:
  experiment: [no_readout]
  dataset.loader.parameters.adjacency_method: [wgcna]
  dataset.loader.parameters.node_sample_ratio: [0.5]
  dataset.loader.parameters.method: [variance]

search_space:
  optimizer.parameters.lr:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  model.backbone.dropout: [0.1]

per_model_search_space:
  gcn:
    model.feature_encoder.out_channels: [32]
    model.backbone.num_layers: [2]

thresholds_from: multi_dataset_grid_search.yaml
string_adjacency_threshold: 0.4

objective:
  metric: best_val/f1_macro
  direction: maximize

optuna:
  n_trials: 2
  sampler_seed: 1234
  n_startup_trials: 1
  study_name_prefix: smoke
  storage: sqlite:///./search_results/optuna_smoke_test/studies.db
  heartbeat_interval: 10
  grace_period: 60
  max_retries: 1

training:
  timeout: 3600
  output_dir: ./search_results/optuna_smoke_test
