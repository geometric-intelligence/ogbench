# October k-fold relaunch: the full-factorial structural ablations of September, rerun on the
# corrected k-fold pipeline and extended to node_sample_ratio 0.3. Seven Optuna trials inside
# every fixed cell; each fold trains for at most one hour and is then tested on its best
# checkpoint. Server-specific paths come from the launcher (--root-dir, --output-dir).

datasets:
  - parkinsons
  - addneuromed
  - motrpac
  - brca
  - tuberculosis
  - smoking

models:
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - sagn
  - chebnet
  - mlp
  - gps

training_seed: 42
k: 5
folds: [0, 1, 2, 3, 4]

fixed:
  logger.wandb.project: ogbench_oct_kfold_factorial
  logger.wandb.entity: bioshape-lab
  paths.root_dir: /scratch/lcornelis/ogbench

ablations:
  experiment:
    - omics_readout
    - no_readout
  dataset.loader.parameters.adjacency_method:
    - wgcna
    - string
  dataset.loader.parameters.node_sample_ratio:
    - 1.0
    - 0.8
    - 0.5
    - 0.3
  dataset.loader.parameters.method:
    - variance
    - random
    - correlation
    - distance_correlation

ablation_design:
  mode: full_factorial

exclude_cells:
  - model: mlp
    experiment: omics_readout

search_space:
  optimizer.parameters.lr:
    type: float
    low: 0.00001
    high: 0.01
    log: true
  optimizer.parameters.weight_decay:
    type: categorical
    choices: [0.0, 0.000001, 0.00001, 0.0001]
  model.backbone.dropout:
    type: float
    low: 0.0
    high: 0.5
    step: 0.1

per_model_search_space:
  gcn:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  gin:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  gatv2:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.backbone.heads: [2, 4, 8]

  gatv4:
    model.backbone.hidden_channels:
      type: categorical
      choices:
        - [16, 32]
        - [32, 64]
        - [64, 128]
    model.backbone.heads:
      type: categorical
      choices:
        - [4, 4]
        - [8, 8]
    model.backbone.use_layer_norm: [true, false]

  graph_sage:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  sagn:
    model.backbone.hidden_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.backbone.num_heads: [2, 4, 8]

  chebnet:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]

  mlp:
    model.backbone.hidden_channels:
      type: categorical
      choices:
        - [16, 32, 8]
        - [32, 64, 16]
        - [64, 128, 32]
    model.backbone.norm: [null, batch]

  gps:
    model.feature_encoder.out_channels: [16, 32, 64, 128]
    model.backbone.num_layers: [2, 3, 4]
    model.encodings:
      type: categorical
      choices:
        - [LapPE]
        - [RWSE]

# WGCNA graphs are built independently from each fold's training samples. Keep
# the strongest undirected edges needed to get as close as possible to 10%.
wgcna_target_connectivity: 0.10
string_adjacency_threshold: 0.4

objective:
  metric: best_val/f1_macro
  direction: maximize

optuna:
  n_trials: 7
  sampler_seed: 1234
  n_startup_trials: 3
  study_name_prefix: octkfoldtc10
  storage: sqlite:///./search_results/oct_kfold_factorial/studies.db
  heartbeat_interval: 60
  grace_period: 300
  max_retries: 1

tags:
  - optuna_ablation
  - oct_kfold_factorial
  - foldlocal_wgcna

training:
  # Training stops gracefully at the budget and the best checkpoint is tested; the fold
  # process is killed only after time_budget + timeout_grace.
  time_budget: 3600
  timeout_grace: 900
  timeout: 4500
  output_dir: ./search_results/oct_kfold_factorial
