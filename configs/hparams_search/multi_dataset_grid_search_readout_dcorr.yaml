# Hyperparameter grid search configuration for parkinsons dataset
# Used by scripts/hyperparam_search.py

datasets:
  - parkinsons
  - addneuromed
  - motrpac

models:
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - sagn
  - chebnet

seeds: [42, 123, 456]

# Fixed parameters (not searched)
fixed:
  experiment: omics_readout
  logger.wandb.project: bgbench_multi_dataset_grid_search_readout

# Shared hyperparameter grid (applied to all models)
shared_grid:
  dataset.loader.parameters.node_sample_ratio:
    - 1.0
    - 0.8
    - 0.5
  dataset.loader.parameters.method:
    - distance_correlation
  optimizer.parameters.lr:
    - 0.0001
    - 0.001
    # - 0.01
  optimizer.parameters.weight_decay:
    - 0.0
    #- 0.0001 removed for readout grid search
    - 0.001
  model.backbone.dropout:
    - 0.1
    - 0.3
  model.readout.readout_name:
    - OmicsReadOut
  model.readout.fc_dim:
    # - [8, 4, 2]
    - [16, 8, 4]
  # model.readout.fc_dropout is automatically set to match model.backbone.dropout

# Per-model hyperparameter grids
per_model_grid:
  gcn:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gin:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8

  gatv2:
    model.feature_encoder.out_channels:
      - 16
      - 32
    model.backbone.num_layers:
      - 2
      - 4
    #  - 8 removed for readout grid search
    model.backbone.heads:
      - 4
      - 8

  gatv4:
    model.backbone.hidden_channels:
      - [16, 32]
      - [32, 64]
    model.backbone.heads:
      - [4, 4]
      - [8, 8]
    model.backbone.use_layer_norm:
      - true
      - false

  graph_sage:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8

  sagn:
    model.backbone.hidden_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8
    model.backbone.num_heads:
      - 1
      - 3

  chebnet:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4

# Per-dataset, per-node_sample_ratio, per-method hyperparameter grids
# Format: "dataset,ratio,method" as key (e.g., "parkinsons,1.0,variance")
# Organized by ratio and method first, then by dataset
per_dataset_ratio_method_grid:
  # ratio=1.0, method=distance_correlation
  motrpac,1.0,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0585]

  parkinsons,1.0,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0096]

  addneuromed,1.0,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0098]

  # ratio=0.8, method=distance_correlation
  motrpac,0.8,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0476]

  parkinsons,0.8,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0095]

  addneuromed,0.8,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.1769]

  # ratio=0.5, method=distance_correlation
  motrpac,0.5,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0370]

  parkinsons,0.5,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0086]

  addneuromed,0.5,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0097]

# Training settings
training:
  timeout: 3600 # 1 hour per run
  output_dir: ./search_results/multi_dataset_grid_search
