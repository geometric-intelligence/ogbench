# Hyperparameter grid search configuration for parkinsons dataset
# Used by scripts/hyperparam_search.py

datasets:
  - brca

models:
  - gps
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - sagn
  - chebnet

seeds: [42, 123, 456]

# Fixed parameters (not searched)
fixed:
  experiment: omics_readout
  logger.wandb.project: brca_grid_search_readout
  dataset.loader.parameters.adjacency_method: wgcna

# Shared hyperparameter grid (applied to all models)
shared_grid:
  dataset.loader.parameters.node_sample_ratio:
    - 1.0
    - 0.8
    - 0.5
    - 0.3
  dataset.loader.parameters.method:
    - variance
    - random
    - correlation
    - distance_correlation
  optimizer.parameters.lr:
    - 0.0001
    - 0.001
    # - 0.01
  optimizer.parameters.weight_decay:
    - 0.0
    #- 0.0001 removed for readout grid search
    - 0.001
  model.backbone.dropout:
    - 0.1
    - 0.3
  model.readout.readout_name:
    - OmicsReadOut
  model.readout.fc_dim:
    # - [8, 4, 2]
    - [16, 8, 4]
  # model.readout.fc_dropout is automatically set to match model.backbone.dropout

# Per-model hyperparameter grids
per_model_grid:
  gps:
    model.feature_encoder.out_channels:
      - 16
      - 32
    model.backbone.num_layers:
      - 2
      - 4
    model.encodings:
      - ["LapPE"]
      - ["RWSE"]

  gcn:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gin:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8

  gatv2:
    model.feature_encoder.out_channels:
      - 16
      - 32
    model.backbone.num_layers:
      - 2
      - 4
    #  - 8 removed for readout grid search
    model.backbone.heads:
      - 4
      - 8

  gatv4:
    model.backbone.hidden_channels:
      - [16, 32]
      - [32, 64]
    model.backbone.heads:
      - [4, 4]
      - [8, 8]
    model.backbone.use_layer_norm:
      - true
      - false

  graph_sage:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8

  sagn:
    model.backbone.hidden_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      # - 8
    model.backbone.num_heads:
      - 1
      - 3

  chebnet:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4

per_dataset_ratio_method_grid:
  # ratio=1.0, method=variance
  brca,1.0,variance:
    dataset.loader.parameters.adjacency_threshold: [0.0032]

  # ratio=1.0, method=random
  brca,1.0,random:
    dataset.loader.parameters.adjacency_threshold: [0.0006]

  # ratio=1.0, method=correlation
  brca,1.0,correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0020]

  # ratio=1.0, method=distance_correlation
  brca,1.0,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0007]

  # ratio=0.8, method=variance
  brca,0.8,variance:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.8, method=random
  brca,0.8,random:
    dataset.loader.parameters.adjacency_threshold: [0.0010]

  # ratio=0.8, method=correlation
  brca,0.8,correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.8, method=distance_correlation
  brca,0.8,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.5, method=variance
  brca,0.5,variance:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.5, method=random
  brca,0.5,random:
    dataset.loader.parameters.adjacency_threshold: [0.0007]

  # ratio=0.5, method=correlation
  brca,0.5,correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.5, method=distance_correlation
  brca,0.5,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.3, method=variance
  brca,0.3,variance:
    dataset.loader.parameters.adjacency_threshold: [0.0006]

  # ratio=0.3, method=random
  brca,0.3,random:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

  # ratio=0.3, method=correlation
  brca,0.3,correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0014]

  # ratio=0.3, method=distance_correlation
  brca,0.3,distance_correlation:
    dataset.loader.parameters.adjacency_threshold: [0.0005]

# Training settings
training:
  timeout: 3600 # 1 hour per run
  output_dir: ./search_results/multi_dataset_grid_search
