# Hyperparameter grid search for all experiments
# Used by scripts/hyperparam_search.py

datasets:
  - parkinsons
  - addneuromed
  - motrpac
  - brca
  - tuberculosis
  - smoking

models:
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - sagn
  - chebnet
  - mlp
  - gps

seeds: [42, 123, 456]

# Fixed parameters (not searched)
fixed:
  logger.wandb.project: ogbench_dataset_grid_search_final
  logger.wandb.entity: bioshape-lab
  paths.root_dir: /scratch/lcornelis/ogbench

# Shared hyperparameter grid (applied to all models)
shared_grid:
  experiment:
    - omics_readout
    - no_readout
  dataset.loader.parameters.adjacency_method:
    - wgcna
    - string
  dataset.loader.parameters.node_sample_ratio:
    - 1.0
    - 0.8
    - 0.5
    - 0.3
  dataset.loader.parameters.method:
    - variance
    - random
    - correlation
    - distance_correlation
  optimizer.parameters.lr:
    - 0.0001
    - 0.001
  optimizer.parameters.weight_decay:
    - 0.0
  model.backbone.dropout:
    - 0.1
  # model.readout.fc_dropout is automatically set to match model.backbone.dropout

# Per-model hyperparameter grids
per_model_grid:
  gcn:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gin:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gatv2:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
    model.backbone.heads:
      - 2
      - 4

  gatv4:
    model.backbone.hidden_channels:
      - [16, 32]
      - [32, 64]
    model.backbone.heads:
      - [4, 4]
      - [8, 8]
    model.backbone.use_layer_norm:
      - true
      - false

  graph_sage:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  sagn:
    model.backbone.hidden_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
    model.backbone.num_heads:
      - 2
      - 4

  chebnet:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  mlp:
    model.backbone.hidden_channels:
      - [16, 32, 8]
      - [32, 64, 16]
      - [64, 128, 32]
    model.backbone.norm:
      - null
      - batch

  gps:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
    model.encodings:
      - ["LapPE"]
      - ["RWSE"]

# WGCNA graphs keep the strongest train-split edges nearest to 10% density,
# including fixed 70/15/15 splits. STRING uses a fixed combined-score cutoff.
wgcna_target_connectivity: 0.10
string_adjacency_threshold: 0.4

# Training settings
training:
  timeout: 3600 # 1 hour per run
  output_dir: ./search_results/multi_dataset_grid_search
