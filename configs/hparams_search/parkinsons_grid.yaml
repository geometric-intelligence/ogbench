# Hyperparameter grid search configuration for parkinsons dataset
# Used by scripts/hyperparam_search.py

dataset: parkinsons
models:
  - gcn
  - gin
  - gatv2
  - gatv4
  - graph_sage
  - mlp
  - sagn

seeds: [42, 123, 456]

# Fixed parameters (not searched)
fixed:
  dataset.loader.parameters.node_sample_ratio: 1.0
  dataset.loader.parameters.method: variance
  dataset.loader.parameters.adjacency_threshold: 0.0463
  logger.wandb.project: bgbench_hyperparams

# Shared hyperparameter grid (applied to all models)
shared_grid:
  optimizer.parameters.lr:
    - 0.0001
    - 0.0005
    - 0.001
    - 0.005
    - 0.01
  optimizer.parameters.weight_decay:
    - 0.0
    - 0.0001
    - 0.001
  model.backbone.dropout:
    - 0.0
    - 0.1
    - 0.3
    - 0.5
  optimizer.batch_size:
    - 4
    - 8
    - 16
    - 32
# Per-model hyperparameter grids
per_model_grid:
  gcn:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gin:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      - 8

  gatv2:
    model.feature_encoder.out_channels:
      - 16
      - 32
    model.backbone.num_layers:
      - 2
      - 4
      - 8
    model.backbone.heads:
      - 4
      - 8

  gatv4:
    model.backbone.hidden_channels:
      - [16, 32]
      - [32, 64]
    model.backbone.heads:
      - [4, 4]
      - [8, 8]
    model.backbone.use_layer_norm:
      - true
      - false

  graph_sage:
    model.feature_encoder.out_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      - 8

  mlp:
    model.backbone.hidden_channels:
      - [16, 32, 8]
      - [32, 64, 16]
      - [64, 128, 32]
    model.backbone.norm:
      - null
      - batch

  sagn:
    model.backbone.hidden_channels:
      - 16
      - 32
      - 64
    model.backbone.num_layers:
      - 2
      - 4
    model.backbone.alpha:
      - 0.3
      - 0.5
      - 0.7
    model.backbone.num_heads:
      - 3
      - 5

# Training settings
training:
  timeout: 3600 # 1 hour per run
  output_dir: ./search_results/parkinsons_grid
