# Hyperparameter grid search configuration for parkinsons dataset with OmicsReadOut
# Used by scripts/hyperparam_search.py

dataset: parkinsons
models:
  - gcn
  - gin
  - gatv2
  - graph_sage
  - chebnet

seeds: [42, 123, 456]

# Custom tags for wandb (appended to auto-generated [model, dataset, hpsearch])
tags:
  - omics_readout

# Fixed parameters (not searched)
fixed:
  experiment: omics_readout
  dataset.loader.parameters.node_sample_ratio: 1.0
  dataset.loader.parameters.method: variance
  dataset.loader.parameters.adjacency_threshold: 0.0463
  logger.wandb.project: bgbench_hyperparams

# Shared hyperparameter grid (applied to all models)
shared_grid:
  optimizer.parameters.lr:
    - 0.0001
    - 0.001
    - 0.01
  optimizer.parameters.weight_decay:
    - 0.0
    - 0.0001
    - 0.001
  model.backbone.dropout:
    - 0.0
    - 0.2
    - 0.5
  # OmicsReadOut specific
  model.readout.fc_dim:
    - [8, 4, 2]
    - [16, 8, 4]
  model.readout.fc_dropout:
    - 0.1
    - 0.3

# Per-model hyperparameter grids
per_model_grid:
  gcn:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

  gin:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      - 8

  gatv2:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      - 8
    model.backbone.heads:
      - 4
      - 8

  graph_sage:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4
      - 8

  chebnet:
    model.feature_encoder.out_channels:
      - 16
      - 64
    model.backbone.num_layers:
      - 2
      - 4

# Training settings
training:
  timeout: 3600 # 1 hour per run
  output_dir: ./search_results/parkinsons_omics_readout
