_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 5 # prevents early stopping
max_epochs: 50
#accumulate_grad_batches: 1

accelerator: gpu
devices: [0]

# mixed precision for extra speed-up (bf16 preferred on A100 for stability + speed)
precision: bf16-mixed

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# set True to to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: False

# inference mode: Whether to use :func:`torch.inference_mode` or :func:`torch.no_grad`
# during evaluation (``validate``/``test``/``predict``).
inference_mode: False
