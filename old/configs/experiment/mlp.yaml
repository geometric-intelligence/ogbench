# @package _global_

# to execute this experiment run:
# python train.py experiment=graphsage

defaults:
  - override /data: pancancer
  - override /model: gcn
  - override /callbacks: default
  - override /trainer: default

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 300
  gradient_clip_val: 0.8

model:
  optimizer:
    _target_: torch.optim.SGD
    lr: 5e-2
    # weight_decay: 0.0
    weight_decay: 0.000
  net:
    _target_: torch_geometric.nn.MLP
    in_channels: 1
    out_channels: 1
    num_layers: 2
    hidden_channels: 256
    dropout: 0.0
  compile: false
  adjacency_aware: false
  scheduler: null

data:
  batch_size: 128

logger:
  wandb:
    tags: ${tags}
