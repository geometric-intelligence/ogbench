[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogbench"
dynamic = ["version"]
readme = "README.md"
description = "Omics Graph Benchmarking"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
requires-python = ">=3.12,<3.13"
dependencies=[
    "tqdm",
    "numpy",
    "scipy",
    "dcor",
    "requests",
    "scikit-learn",
    "matplotlib",
    "networkx",
    "pandas",
    "decorator",
    "hypernetx < 2.0.0",
    "trimesh",
    "spharapy",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",
    "wandb",
    "fastmcp",
    "einops==0.8.2",
    "tabulate",
    "ipykernel",
    "notebook",
    "jupyterlab",
    "rich",
    "ogb",
    "rootutils",
    "PyWGCNA",
    "pre-commit",
    "openpyxl",
    "fastparquet",
    "datasets>=4.8.4",
    "typer>=0.9.0",
    "huggingface-hub>=0.20.0",
    "torch-sparse",
    "torch-scatter",
    "torch==2.8.0",
    "torch-cluster",
    "pyg-lib>=0.6.0",
    "combat>=0.3.3",
    "topomodelx @ git+https://github.com/pyt-team/TopoModelX.git",
    "toponetx @ git+https://github.com/pyt-team/TopoNetX.git",
    "lightning>=2.5.0",
]

[project.optional-dependencies]
doc = [
    "jupyter",
    "nbsphinx",
    "nbsphinx_link",
    "numpydoc",
    "sphinx",
    "sphinx_gallery",
    "pydata-sphinx-theme",
    "myst_parser"
]
lint = [
    "pre-commit",
    "ruff"
]
test = [
    "pytest",
    "pytest-cov",
    "coverage",
    "jupyter",
    "mypy",
    "pytest-mock"
]

dev = ["ogbench[test, lint]"]
all = ["ogbench[dev, doc]"]


[project.scripts]
ogbench-train = "ogbench.run:main"

[project.urls]
homepage="https://geometric-intelligence.github.io/ogbench/index.html"
repository="https://github.com/geometric-intelligence/ogbench"

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = [
    "*.ipynb",
    "notebooks/*",
    "tutorials/*",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"ogbench/baseline.py" = ["I001"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ogbench"]

[tool.docformatter]
wrap-summaries = 79
wrap-descriptions = 79

[tool.ruff.pydocstyle]
convention = "pep257"

[tool.hatch.version]
path = "ogbench/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ogbench"]


[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disable_error_code = ["import-untyped"]
plugins = "numpy.typing.mypy_plugin"

[[tool.mypy.overrides]]
module = [
    "torch_cluster.*","networkx.*","scipy.spatial","scipy.sparse","toponetx.classes.simplicial_complex"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--capture=no"
pythonpath = [
  "."
]

[tool.uv]
index-url = "https://pypi.org/simple"
find-links = ["https://data.pyg.org/whl/torch-2.8.0+cu128.html"]
